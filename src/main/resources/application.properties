spring.application.name=Notification-Alerts

#mysql
spring.datasource.url= jdbc:mysql://localhost:3306/notification_alert
spring.datasource.driverClassName=com.mysql.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Sasi@1457
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#mysql dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#Kafka Config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=alert-group

#consumer config
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages= "*"
spring.kafka.consumer.properties.spring.json.value.default.type=com.apex.trade.Notification_Alerts.trade_execution_alerts.dto.TradeEventDTO

#producer config
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

