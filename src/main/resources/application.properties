spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# === Finnhub provider config for volatility alerts ===
volatility.provider=finnhub

# Your Finnhub API key (replace with the real key)
finnhub.api.key=YOUR_FINNHUB_API_KEY

# Polling interval for volatility job (seconds)
volatility.poll-interval-seconds=60

# Example index configuration for Finnhub (use provider symbol that Finnhub understands)
volatility.indices[0].name=NIFTY_50
# We will use apiSymbol to build the Finnhub request; pick the symbol that Finnhub expects for the index.
# Common option for NIFTY is ^NSEI or NSE:NIFTY (verify in Finnhub). Use what works for you.
volatility.indices[0].apiSymbol=^NSEI
volatility.indices[0].thresholdPercent=5.0
volatility.indices[0].windowMinutes=30
volatility.indices[0].notifyEmail=traders@example.com

